# =====================================================
# CONFIGURACIÓN PIPELINE LANDSAT — PoC Laguna de Aculeo
# Landsat Collection 2 Level-2 Surface Reflectance
# =====================================================

# M2M API
m2m:
  api_url: "https://m2m.cr.usgs.gov/api/api/json/stable/"
  max_cloud_cover: 70      # Umbral alto para ingesta bronze; filtros QA se aplican en silver/gold
  max_retries: 3
  timeout_seconds: 1200

# =====================================================
# DATASETS — PoC solo Landsat 8/9 (OLI_TIRS)
# =====================================================
datasets:
  landsat_8_9:
    m2m_name: "landsat_ot_c2_l2"
    description: "Landsat 8-9 OLI_TIRS Collection 2 Level-2"
    sensors: ["OLI_TIRS"]
    date_range: ["2013-04-11", "2026-12-31"]
    bands:
      green:      "SR_B3"
      nir:        "SR_B5"       # Requerido para NDWI (McFeeters)
      swir1:      "SR_B6"       # Requerido para MNDWI
      qa_pixel:   "QA_PIXEL"
      qa_radsat:  "QA_RADSAT"
      qa_aerosol: "QA_AEROSOL"  # Solo L8/9
      metadata:   "MTL"

# =====================================================
# MÁSCARAS QA — QA_PIXEL (Collection 2)
# =====================================================
qa_masks:
  qa_pixel:
    fill:           0   # Bit 0: sin datos
    dilated_cloud:  1   # Bit 1: buffer de nubes
    cloud:          3   # Bit 3: nube
    cloud_shadow:   4   # Bit 4: sombra de nube
    snow:           5   # Bit 5: nieve (poco relevante en Aculeo verano)
    combined_mask: 0x003B   # Bits 0,1,3,4,5 → 0b0000000000111011
  qa_radsat:
    # Saturación en bandas de interés (L8/9)
    green_bit:  2   # Bit 2 = Band 3 (green)
    swir1_bit:  5   # Bit 5 = Band 6 (swir1)
    nir_bit:    4   # Bit 4 = Band 5 (nir)
  qa_aerosol:
    # Bits relevantes para OLI_TIRS
    valid_retrieval_bit: 0
    water_bit:           2

# =====================================================
# ÁREA DE INTERÉS — Laguna de Aculeo
# =====================================================
aoi:
  name: "Laguna de Aculeo"
  country: "Chile"
  sscuenca_id: 411                      # cuencas.dga_subsub_cuenca
  wrs_path: 233                         # WRS-2 Path
  wrs_row:  83                          # WRS-2 Row
  epsg: 32719                           # UTM Zone 19S — SRID nativo de los rasters
  bbox: [-71.05, -33.95, -70.80, -33.75]  # [minLon, minLat, maxLon, maxLat] WGS84

# =====================================================
# DESCARGA
# =====================================================
download:
  file_type: "band"
  max_concurrent: 4
  chunk_size_bytes: 8192
  retry_failed: true
  retry_delay_seconds: 5

# =====================================================
# ALMACENAMIENTO
# =====================================================
storage:
  temp_dir:  "data/temp"
  logs:      "logs/etl"

# =====================================================
# PROCESAMIENTO — Índices y umbrales
# =====================================================
processing:
  mndwi:
    formula: "(SR_B3 - SR_B6) / (SR_B3 + SR_B6)"
    water_threshold: 0.0
    nodata_value: -9999
  ndwi:
    formula: "(SR_B3 - SR_B5) / (SR_B3 + SR_B5)"
    water_threshold: 0.0
    nodata_value: -9999

# =====================================================
# LOGGING
# =====================================================
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_rotation: "midnight"
  backup_count: 30